<!-- Floating Chat Button -->
<button
  *ngIf="!isOpen"
  (click)="toggleChat()"
  class="chat-bubble"
  aria-label="Open chat assistant"
>
  <svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 24 24"
    fill="currentColor"
    class="w-7 h-7"
  >
    <path
      fill-rule="evenodd"
      d="M4.848 2.771A49.144 49.144 0 0112 2.25c2.43 0 4.817.178 7.152.52 1.978.292 3.348 2.024 3.348 3.97v6.02c0 1.946-1.37 3.678-3.348 3.97a48.901 48.901 0 01-3.476.383.39.39 0 00-.297.17l-2.755 4.133a.75.75 0 01-1.248 0l-2.755-4.133a.39.39 0 00-.297-.17 48.9 48.9 0 01-3.476-.384c-1.978-.29-3.348-2.024-3.348-3.97V6.741c0-1.946 1.37-3.68 3.348-3.97z"
      clip-rule="evenodd"
    />
  </svg>
  <span class="chat-bubble-badge">?</span>
</button>

<!-- Backdrop for click-outside-to-close -->
<div 
  *ngIf="isOpen" 
  class="chat-backdrop"
  (click)="closeChat()"
></div>

<!-- Chat Window -->
<div #chatWindow *ngIf="isOpen" class="chat-window" (click)="$event.stopPropagation()">
  <!-- Header -->
  <div class="chat-header">
    <div class="flex items-center gap-3">
      <div class="chat-avatar">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="currentColor"
          class="w-5 h-5"
        >
          <path
            fill-rule="evenodd"
            d="M4.848 2.771A49.144 49.144 0 0112 2.25c2.43 0 4.817.178 7.152.52 1.978.292 3.348 2.024 3.348 3.97v6.02c0 1.946-1.37 3.678-3.348 3.97a48.901 48.901 0 01-3.476.383.39.39 0 00-.297.17l-2.755 4.133a.75.75 0 01-1.248 0l-2.755-4.133a.39.39 0 00-.297-.17 48.9 48.9 0 01-3.476-.384c-1.978-.29-3.348-2.024-3.348-3.97V6.741c0-1.946 1.37-3.68 3.348-3.97z"
            clip-rule="evenodd"
          />
        </svg>
      </div>
      <div>
        <h3 class="chat-title">Digital Tyler ⚔️</h3>
        <p class="chat-subtitle">Ask me anything!</p>
      </div>
    </div>
    <button
      (click)="closeChat()"
      class="chat-close-btn"
      aria-label="Close chat"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="currentColor"
        class="w-5 h-5"
      >
        <path
          fill-rule="evenodd"
          d="M5.47 5.47a.75.75 0 011.06 0L12 10.94l5.47-5.47a.75.75 0 111.06 1.06L13.06 12l5.47 5.47a.75.75 0 11-1.06 1.06L12 13.06l-5.47 5.47a.75.75 0 01-1.06-1.06L10.94 12 5.47 6.53a.75.75 0 010-1.06z"
          clip-rule="evenodd"
        />
      </svg>
    </button>
  </div>

  <!-- Messages Area -->
  <div #messagesContainer class="chat-messages">
    <div
      *ngFor="let message of messages"
      [class]="message.sender === 'user' ? 'message-user' : 'message-bot'"
    >
      <div
        [class]="
          message.sender === 'user'
            ? 'message-bubble-user'
            : 'message-bubble-bot'
        "
        [innerHTML]="formatMessage(message.text)"
      ></div>
      <span class="message-time">{{
        formatTime(message.timestamp)
      }}</span>
    </div>
  </div>

  <!-- Input Area -->
  <div class="chat-input-area">
    <form (ngSubmit)="sendMessage()" class="chat-form">
      <input
        #inputField
        type="text"
        [(ngModel)]="userInput"
        name="userInput"
        placeholder="Type your message..."
        class="chat-input"
        autocomplete="off"
      />
      <button
        type="submit"
        [disabled]="!userInput.trim()"
        class="chat-send-btn"
        aria-label="Send message"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="currentColor"
          class="w-5 h-5"
        >
          <path
            d="M3.478 2.405a.75.75 0 00-.926.94l2.432 7.905H13.5a.75.75 0 010 1.5H4.984l-2.432 7.905a.75.75 0 00.926.94 60.519 60.519 0 0018.445-8.986.75.75 0 000-1.218A60.517 60.517 0 003.478 2.405z"
          />
        </svg>
      </button>
    </form>
  </div>
</div>
